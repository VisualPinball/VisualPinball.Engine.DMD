name: Build
on: [ push, pull_request ]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the dmd-extensions source used to build the LibDmd.Core proxy.
      - name: Checkout dmd-extensions
        uses: actions/checkout@v4
        with:
          repository: freezy/dmd-extensions
          ref: 9387c66046a1390cd81170c4defe3710f59ec8cd
          path: dmd-extensions

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Stages libserum/libzedmd (downloaded) + the vendored libusb/ftd2xx into
      # dmd-extensions/native/nuget/runtimes, which the proxy's PluginsDeploy copies per RID.
      - name: Stage native binaries
        run: ./dmd-extensions/build-nuget/fetch-natives.sh

      # DMD natives are prebuilt (not compiled here), so a single runner builds every RID. Each build
      # deploys the managed assemblies to Plugins/Managed (shared) and the natives to Plugins/<rid>.
      - name: Build proxy (all RIDs)
        run: |
          for rid in win-x64 osx-x64 osx-arm64 linux-x64; do
            dotnet build VisualPinball.Engine.DMD/VisualPinball.Engine.DMD.csproj \
              -c Release -r "$rid" \
              -p:LibDmdExtensionsRoot="$GITHUB_WORKSPACE/dmd-extensions"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Plugins
          path: VisualPinball.Engine.DMD.Unity/Plugins

  dispatch:
    runs-on: ubuntu-latest
    needs: [ build ]
    # Adjust the repository slug to wherever this repo lives (forks must not trigger a release).
    if: github.repository == 'VisualPinball/VisualPinball.Engine.DMD' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          event-type: build-complete
          client-payload: '{"artifacts_run_id": "${{ github.run_id }}"}'
