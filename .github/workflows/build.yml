name: Build
on: [ push, pull_request ]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The LibDmd managed and native dependencies come from NuGet. Each build
      # deploys the managed assemblies to Plugins/Managed (shared) and the natives to Plugins/<rid>.
      - name: Build proxy (all RIDs)
        run: |
          for rid in win-x64 osx-x64 osx-arm64 linux-x64; do
            dotnet build VisualPinball.Engine.DMD/VisualPinball.Engine.DMD.csproj -c Release -r "$rid"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Plugins
          path: VisualPinball.Engine.DMD.Unity/Plugins

  dispatch:
    runs-on: ubuntu-latest
    needs: [ build ]
    # Adjust the repository slug to wherever this repo lives (forks must not trigger a release).
    if: github.repository == 'VisualPinball/VisualPinball.Engine.DMD' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          event-type: build-complete
          client-payload: '{"artifacts_run_id": "${{ github.run_id }}"}'
